name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Add Android SDK tools to PATH
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
